<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add More Navbar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
        }

        /* First Navbar */
        .navbar1 {
            background: #222;
            padding: 15px;
        }

        .navbar1 ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .navbar1 a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        .navbar1 a:hover {
            color: orange;
        }

        /* Second Navbar */
        .navbar2 {
            background: #ff9800;
            padding: 12px;
        }

        .navbar2 ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .navbar2 a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .navbar2 a:hover {
            text-decoration: underline;
        }

        /* Third Navbar */
        .navbar3 {
            background: #4CAF50;
            padding: 12px;
        }

        .navbar3 ul {
            list-style: none;
            display: flex;
            justify-content: space-around;
        }

        .navbar3 a {
            color: white;
            text-decoration: none;
            font-size: 17px;
        }

        .navbar3 a:hover {
            background: white;
            color: #4CAF50;
            padding: 5px 10px;
            border-radius: 5px;
        }

        h1 {
            text-align: center;
            margin-top: 40px;
            color: #333;
        }
    </style>
</head>

<body>

    <!-- Navbar 1 -->
    <nav class="navbar1">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- Navbar 2 -->
    <nav class="navbar2">
        <ul>
            <li><a href="#">Gallery</a></li>
            <li><a href="#">Blog</a></li>
            <li><a href="#">Projects</a></li>
            <li><a href="#">Help</a></li>
        </ul>
    </nav>

    <!-- Navbar 3 -->
    <nav class="navbar3">
        <ul>
            <li><a href="#">Login</a></li>
            <li><a href="#">Signup</a></li>
            <li><a href="#">Profile</a></li>
            <li><a href="#">Settings</a></li>
        </ul>
    </nav>

    <h1>Project: Add More Navbar</h1>

</body>

</html>
