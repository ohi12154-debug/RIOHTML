<!DOCTYPE html>
<html>

<head>
    <title>Happy Father's Day</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            text-align: center;
            padding: 50px;
        }

        .card {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 15px gray;
        }

        h1 {
            color: #1e90ff;
        }

        p {
            font-size: 18px;
            color: #333;
        }

        .heart {
            font-size: 50px;
        }

        button {
            background-color: #1e90ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0066cc;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="heart">💙</div>
        <h1>Happy Father's Day!</h1>

        <p>
            Dear Dad,<br><br>
            Thank you for your love, support, and care.
            You are my hero and my inspiration.
            I am lucky to have you in my life.
            "Dad, thank you for always believing in me and supporting me.
            You are my first hero and my forever friend.
            Happy Father's Day!"
        </p>

        <h2>Love You, Baba! 🥰</h2>

        <button onclick="alert('Happy Father’s Day! ❤️')">
            Click for a Surprise
        </button>
    </div>

</body>

</html>
